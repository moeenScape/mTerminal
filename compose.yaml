name: mterminal-phase7

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mterminal
      POSTGRES_USER: mterminal
      POSTGRES_PASSWORD: ${MTERMINAL_POSTGRES_PASSWORD:?Set MTERMINAL_POSTGRES_PASSWORD in apps/server/.env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'mterminal', '-d', 'mterminal']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
